# Aperçu client. Le site est un export statique (voir next.config.ts) : Netlify
# publie simplement le dossier `out/`.
#
# Le formulaire de contact passe par contact.php, qui ne s'exécute pas ici :
# sur Netlify l'envoi échoue proprement, il ne fonctionne qu'en production chez
# Infomaniak.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# L'aperçu ne doit pas être indexé : ne jamais définir
# NEXT_PUBLIC_ALLOW_INDEXING dans les variables Netlify.
