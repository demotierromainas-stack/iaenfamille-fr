# Mise en ligne sur Infomaniak (hébergement PHP/Apache, sans Node.js).
#
# À chaque push sur main : build statique de production, contrôle SEO, puis
# envoi du dossier out/ en FTP. Seuls les fichiers modifiés sont transférés
# (l'action garde un état de synchronisation sur le serveur). Le .env de
# contact.php, créé à la main sur le serveur, n'est jamais touché.
#
# Identifiants à définir une fois (voir deploy/README.md) :
#   secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variable FTP_SERVER_DIR (facultative, /sites/iaenfamille.fr/ par défaut)

name: Déploiement Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul envoi à la fois : deux pushs rapprochés ne s'écrasent pas.
concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      # Historique complet : le sitemap date chaque page de son dernier commit.
      # En clone superficiel, il omettrait ces dates plutôt que d'en donner de fausses.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build de production (indexation autorisée)
        run: npm run build:production

      # Barrière : canonical, aperçus de partage, sitemap, JSON-LD, noindex…
      # En échec, rien n'est envoyé. Détail des contrôles en tête du script.
      - name: Contrôle SEO
        run: node scripts/controler-seo.mjs out --production

      # Le sitemap encore en ligne sert de référence à IndexNow pour repérer
      # les pages ajoutées, modifiées ou supprimées par cet envoi. L'adresse du
      # site est lue dans le sitemap construit, sans la répéter ici.
      - name: Sitemap en ligne avant l'envoi
        if: env.FTP_SERVER != ''
        run: |
          SITE=$(grep -o -m1 '<loc>[^<]*' out/sitemap.xml | cut -c6-)
          curl -sf "${SITE}sitemap.xml" -o "$RUNNER_TEMP/sitemap-avant.xml" \
            || echo "Pas de sitemap en ligne : toutes les pages seront signalées."

      # Tant que les secrets FTP ne sont pas renseignés, le build tourne quand
      # même (il valide le code) mais rien n'est envoyé.
      - name: Envoi FTP vers Infomaniak
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/sites/iaenfamille.fr/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .env

      # Après l'envoi, pour que la clé soit déjà en ligne quand le moteur la
      # vérifie. Bing, Copilot, recherche ChatGPT, DuckDuckGo ; pas Google.
      # Un échec est signalé en avertissement, sans faire échouer le run.
      - name: Signalement IndexNow
        if: env.FTP_SERVER != ''
        run: node scripts/indexnow.mjs out/sitemap.xml "$RUNNER_TEMP/sitemap-avant.xml"

      - name: Secrets FTP manquants
        if: env.FTP_SERVER == ''
        run: echo "::warning::Secrets FTP non configurés, site construit mais non envoyé. Voir deploy/README.md."
